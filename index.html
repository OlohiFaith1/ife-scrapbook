<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>why don’t we return the pens we borrow?</title>
    <meta name="theme-color" content="#1749d1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" as="image" href="/texture/wall-texture.webp" type="image/webp" />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/pages/cover-800.webp 800w, /pages/cover-1200.webp 1200w"
      imagesizes="min(33vw, 46.4vh)"
    />
  </head>
  <body>
    <main class="experience" data-state="loading">
      <!-- Screen 1 — Figma: Desktop - 1 (58:93) -->
      <section class="screen screen--question" aria-labelledby="question">
        <div class="texture" aria-hidden="true"></div>
        <div class="stage">
          <h1 id="question" class="question">why don’t we<br />return the pens<br />we borrow?</h1>
          <p class="credit">
            <span class="credit__muted">created by</span> <a class="credit__link" href="https://snowolohijere.com/">Snow</a>, <span class="credit__muted">for</span> <a class="credit__link" href="https://x.com/theifeolakunle">Ife</a>
          </p>
        </div>
      </section>

      <!-- Screen 2 — Figma: Desktop - 2 (58:98) -->
      <section class="screen screen--book" aria-label="The scrapbook">
        <div class="texture" aria-hidden="true"></div>
        <div class="stage">
          <div class="book" data-book tabindex="-1">
            <!-- Left board: shown flat once the cover has opened. Click = previous spread.
                 Each board holds two stacked images so spreads can crossfade. -->
            <button class="board board--left" type="button" data-side="left">
              <img class="page is-current" data-page="01" alt="" width="7684" height="10872" />
              <img class="page" alt="" width="7684" height="10872" aria-hidden="true" />
            </button>

            <!-- Right board: underneath the cover. Click = next spread. -->
            <button class="board board--right" type="button" data-side="right">
              <img class="page is-current" data-page="02" alt="" width="7684" height="10872" />
              <img class="page" alt="" width="7684" height="10872" aria-hidden="true" />
            </button>

            <!-- The cover leaf hinges on the spine. Front = cover, back = page 01. -->
            <button class="leaf" type="button" data-cover>
              <span class="leaf__face leaf__face--front board board--right">
                <img class="page" data-page="cover" alt="" width="7684" height="10874" />
              </span>
              <span class="leaf__face leaf__face--back board board--left" aria-hidden="true">
                <img class="page" data-page="01" data-decorative alt="" width="7684" height="10872" />
              </span>
            </button>

            <!-- Spiral binding: fixed over the spine, never takes clicks (src/spiral.ts). -->
            <div class="spiral-slot" data-spiral></div>
          </div>
          <p class="credit">
            <span class="credit__muted">created by</span> <a class="credit__link" href="https://snowolohijere.com/">Snow</a>, <span class="credit__muted">for</span> <a class="credit__link" href="https://x.com/theifeolakunle">Ife</a>
          </p>
        </div>
      </section>

      <p class="visually-hidden" aria-live="polite" data-live></p>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
